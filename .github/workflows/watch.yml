# Runs the checks every 15 minutes, keeps every result on the `status`
# branch, and publishes the dashboard to GitHub Pages.
# Alerts go to the webhook in the WATCHTOWER_WEBHOOK secret, if set.
name: watch
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      WATCHTOWER_WEBHOOK: ${{ secrets.WATCHTOWER_WEBHOOK }}
      WATCHTOWER_SOLANA_RPC: ${{ secrets.WATCHTOWER_SOLANA_RPC }}
      # Posting to X: all four keys post; none of them only previews (status branch, x-posts.jsonl)
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      X_DAILY_SUMMARY: ${{ vars.X_DAILY_SUMMARY }}
      X_INCLUDE_LINKS: ${{ vars.X_INCLUDE_LINKS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Load results so far (status branch)
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          if git ls-remote --exit-code --heads origin status >/dev/null; then
            git clone --quiet --depth 1 --branch status "$remote" data
          else
            git init --quiet -b status data
            git -C data remote add origin "$remote"
          fi

      - name: Run the checks that are due
        run: node watchtower.mjs --once --due --export site --config watchtower.ci.json || echo "alerts open (see the dashboard)"

      - name: Save results
        run: |
          cd data
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="zwatchtower-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "results $(date -u +%Y-%m-%dT%H:%MZ)"
            git push --quiet origin status
          fi

      - name: Save the site (gh-pages branch, which GitHub Pages can serve)
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git clone --quiet --depth 1 --branch gh-pages "$remote" pages
          find pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r site/. pages/
          cd pages && git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="zwatchtower-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "site $(date -u +%Y-%m-%dT%H:%MZ)"
            git push --quiet origin gh-pages || echo "site push refused (the server pushed first)"
          fi

      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true   # fails once Pages serves the gh-pages branch instead
